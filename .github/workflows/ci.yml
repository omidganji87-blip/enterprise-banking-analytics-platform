name: Enterprise Banking Platform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  automated-tests:
    name: Automated Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install production dependencies
        run: python -m pip install -r requirements.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Run automated test suite
        run: python -m pytest -q

  operational-powershell:
    name: Validate Operational PowerShell
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Parse operational scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $scripts = Get-ChildItem `
            -LiteralPath "scripts" `
            -Filter "*.ps1" `
            -File

          if ($scripts.Count -eq 0) {
            throw "No operational PowerShell scripts were found."
          }

          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null

            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            if ($parseErrors.Count -gt 0) {
              $messages = $parseErrors.Message -join "; "
              throw "$($script.Name) failed parsing: $messages"
            }

            Write-Host "Parser PASS: $($script.Name)"
          }
